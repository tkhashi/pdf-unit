# GitHub の自動生成リリースノートの分類(ADR 0033)。デプロイのワークフローが gh release create --generate-notes で使う。
# development 向けの PR には種別に応じたラベル(feat → enhancement、fix → bug、docs → documentation)を付ける。
# development → main のリリース PR には release ラベルを付け、一覧から除く。
changelog:
  exclude:
    labels:
      - release
  categories:
    - title: 新機能・改善
      labels:
        - enhancement
    - title: 不具合修正
      labels:
        - bug
    - title: ドキュメント
      labels:
        - documentation
    - title: その他
      labels:
        - "*"
