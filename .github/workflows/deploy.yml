# main へのマージで、Lambda のアプリのコードと S3 の静的ファイルを更新する(ADR 0021)。
# AWS の「入れ物」(S3・Lambda・CloudFront・このワークフローが引き受けるロール)は pdf-unit.infra が作る。
# 必要なリポジトリ変数(Settings → Secrets and variables → Actions → Variables。値は infra の cdk deploy の出力):
#   AWS_REGION, AWS_DEPLOY_ROLE_ARN, LAMBDA_FUNCTION_NAME, SITE_BUCKET_NAME, DISTRIBUTION_ID, SITE_URL
# Secrets は不要(OIDC)。アカウントIDを伏せたい場合だけ AWS_DEPLOY_ROLE_ARN を Secrets に置けばそちらを優先する。
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC で AWS のロールを引き受けるため
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # 途中で止めると Lambda と静的ファイルの版がずれるため、実行中のものは最後まで流す

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # environment: は指定しない。指定すると OIDC トークンの sub が repo:<repo>:environment:<name> になり、
    # infra のロールの信頼条件(repo:tkhashi/pdf-unit:ref:refs/heads/main)と一致しなくなる
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
      SITE_BUCKET_NAME: ${{ vars.SITE_BUCKET_NAME }}
      DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Check repository variables
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          missing=()
          for name in AWS_REGION AWS_DEPLOY_ROLE_ARN LAMBDA_FUNCTION_NAME SITE_BUCKET_NAME DISTRIBUTION_ID SITE_URL; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::リポジトリ変数が未設定です: ${missing[*]}(pdf-unit.infra の README「アプリのデプロイ」を参照)"
            exit 1
          fi

      - uses: actions/checkout@v7

      # setup-uv はメジャー版のタグ(v10)を公開していないため、完全な版で指定する
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Build Lambda zip
        run: scripts/build_lambda.sh

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: pdf-unit-deploy-${{ github.run_id }}

      # Lambda を先に更新する(新しい画面が古いAPIを呼ばないように)
      - name: Update Lambda code
        run: |
          aws lambda update-function-code --function-name "$LAMBDA_FUNCTION_NAME" \
            --zip-file fileb://dist/lambda.zip --query '{Version: Version, CodeSha256: CodeSha256}'
          aws lambda wait function-updated-v2 --function-name "$LAMBDA_FUNCTION_NAME"

      - name: Upload static site
        run: aws s3 sync src/pdf_unit/static "s3://$SITE_BUCKET_NAME" --delete --no-progress

      - name: Invalidate CloudFront
        run: |
          id="$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*' \
            --query Invalidation.Id --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"

      - name: Smoke test
        run: scripts/smoke_test.sh "$SITE_URL"
